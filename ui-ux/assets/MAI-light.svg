<svg xmlns="http://www.w3.org/2000/svg"
     width="880"
     height="680"
     viewBox="0 0 880 680"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Esquema del Componente MAI - Tema Claro (Sala de Control / Escritorio / Día)</title>

  <desc id="desc">
    Especificación HPHMI del Indicador Analógico Móvil (MAI) en Tema Claro con fondo Gris N7.5, rango normal azul claro, puntero neutro invariable, presentación de alarmas Método 3 con alto contraste WCAG y límites de interbloqueo.
  </desc>

  <style>
    .bg { fill: #D8DBE0; }
    .card { fill: #E5E8EC; stroke: #B8C0CC; stroke-width: 1; }
    .title { fill: #111827; font-family: Segoe UI, Inter, Roboto, sans-serif; font-size: 20px; font-weight: 700; }
    .subtitle { fill: #4B5563; font-family: Segoe UI, Inter, Roboto, sans-serif; font-size: 13px; }
    .label { fill: #111827; font-family: Segoe UI, Inter, Roboto, sans-serif; font-size: 14px; font-weight: 500; }
    .label-bold { fill: #111827; font-family: Segoe UI, Inter, Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .label-mono { fill: #111827; font-family: Cascadia Code, SF Mono, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .caption { fill: #4B5563; font-family: Segoe UI, Inter, Roboto, sans-serif; font-size: 12px; }
    .track { fill: #B8C0CC; stroke: #9CA3AF; stroke-width: 1; }
    .normal-zone { fill: #BAE6FD; opacity: 1.0; }
    .pointer-shape { fill: #111827; stroke: #FFFFFF; stroke-width: 2; }
    .scale-line { stroke: #4B5563; stroke-width: 1.5; }
    .guide-line { stroke: #6B7280; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.8; }
    .interlock-block { fill: #111827; }
  </style>

  <!-- Canvas Background (Gris Neutro Munsell N7.5 / Hollifield 500 Lux Control Room Standard) -->
  <rect class="bg" x="0" y="0" width="880" height="680" rx="12" />

  <!-- Header -->
  <text x="440" y="38" text-anchor="middle" class="title">Indicador Analógico Móvil (MAI) — Tema Claro (Sala de Control / Día)</text>
  <text x="440" y="58" text-anchor="middle" class="subtitle">Estándar Hollifield 500 Lux: Ergonomía de Papel, Anti-Reflejo y Saliencia de Alarmas</text>

  <!-- Main Container Card -->
  <rect class="card" x="30" y="75" width="820" height="575" rx="8" />

  <!-- GEOMETRÍA DE PISTA VERTICAL (Escala 0 a 150 PSI) -->
  <!-- 1. Pista Base -->
  <rect class="track" x="435" y="120" width="10" height="450" rx="5" ry="5" />

  <!-- 2. Bloque de Interbloqueo de Seguridad (ESD Top Endpoint) -->
  <rect class="interlock-block" x="433" y="116" width="14" height="8" rx="2" />
  
  <!-- 3. Zona de Operación Normal (Rango Seguro Azul Claro 40.0 - 120.0 PSI) -->
  <rect class="normal-zone" x="435" y="210" width="10" height="240" rx="2" stroke="#0284C7" stroke-width="0.5" />

  <!-- MARCAS Y ETIQUETAS DE ESCALA (Lado Izquierdo) -->
  <line class="scale-line" x1="415" y1="120" x2="435" y2="120" />
  <text x="405" y="125" text-anchor="end" class="label-mono">150.0</text>
  
  <line class="scale-line" x1="415" y1="210" x2="435" y2="210" />
  <text x="405" y="215" text-anchor="end" class="label-mono">120.0</text>

  <line class="scale-line" x1="415" y1="450" x2="435" y2="450" />
  <text x="405" y="455" text-anchor="end" class="label-mono">40.0</text>

  <line class="scale-line" x1="415" y1="570" x2="435" y2="570" />
  <text x="405" y="575" text-anchor="end" class="label-mono">0.0</text>
  
  <text x="390" y="595" text-anchor="end" class="caption">Escala Instrumento (PSI)</text>

  <!-- ANOTACIÓN: ZONA DE OPERACIÓN NORMAL -->
  <line class="guide-line" x1="280" y1="330" x2="430" y2="330" />
  <rect x="120" y="295" width="170" height="70" rx="6" fill="#F4F5F7" stroke="#0284C7" stroke-width="1.5" />
  <text x="205" y="318" text-anchor="middle" class="label-bold" fill="#0284C7">Zona Normal (HPHMI)</text>
  <text x="205" y="338" text-anchor="middle" class="caption">Franja Azul Claro</text>
  <text x="205" y="354" text-anchor="middle" class="label-mono">40.0 – 120.0 PSI</text>

  <!-- ANOTACIÓN: INTERBLOQUEO DE SEGURIDAD (ESD) -->
  <line class="guide-line" x1="280" y1="120" x2="430" y2="120" />
  <rect x="120" y="95" width="170" height="50" rx="6" fill="#F4F5F7" stroke="#6B7280" stroke-width="1" />
  <text x="205" y="116" text-anchor="middle" class="label-bold">Safety Interlock</text>
  <text x="205" y="134" text-anchor="middle" class="caption">Disparo Automático ESD</text>

  <!-- 4. PUNTERO DE VALOR ACTUAL (Neutral e Invariable - 85.3 PSI) -->
  <line class="guide-line" x1="440" y1="314.1" x2="570" y2="314.1" />
  <circle class="pointer-shape" cx="440" cy="314.1" r="8" />
  
  <!-- Tarjeta del Valor Actual (Derecha Central) -->
  <rect x="570" y="285" width="230" height="60" rx="6" fill="#F4F5F7" stroke="#111827" stroke-width="1.5" />
  <text x="585" y="308" class="caption">Lectura Actual (Puntero Neutro):</text>
  <text x="585" y="332" class="label-mono" font-size="18px">85.3 PSI</text>
  <text x="785" y="330" text-anchor="end" class="label" fill="#0D9488">NORMAL</text>

  <!-- 5. PRESENTACIÓN DE ALARMAS MÉTODO 3 -->
  <!-- ALARMA ALTA CRÍTICA (Método 3: Cuadrado Rojo '1' en 135 PSI - Texto Blanco sobre Rojo, Contraste 4.6:1) -->
  <line class="guide-line" x1="450" y1="165" x2="570" y2="165" />
  <rect x="460" y="152" width="26" height="26" rx="4" fill="#E63946" stroke="#111827" stroke-width="1" />
  <text x="473" y="170" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14px" font-weight="800" fill="#FFFFFF">1</text>
  
  <rect x="570" y="140" width="230" height="50" rx="6" fill="#F4F5F7" stroke="#E63946" stroke-width="1.5" />
  <text x="585" y="161" class="label-bold" fill="#E63946">Alarma Crítica Alta (P1)</text>
  <text x="585" y="178" class="caption">Método 3: Elemento [1] separado</text>

  <!-- ADVERTENCIA BAJA (Método 3: Triángulo Ámbar '2' en 30 PSI - Ajustado #AC5E04 para Contraste 3.47:1 WCAG AA) -->
  <line class="guide-line" x1="450" y1="480" x2="570" y2="480" />
  <polygon points="473,465 487,491 459,491" fill="#AC5E04" stroke="#111827" stroke-width="1" />
  <text x="473" y="487" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13px" font-weight="900" fill="#FFFFFF">2</text>

  <rect x="570" y="455" width="230" height="50" rx="6" fill="#F4F5F7" stroke="#AC5E04" stroke-width="1.5" />
  <text x="585" y="476" class="label-bold" fill="#AC5E04">Advertencia Baja (P2)</text>
  <text x="585" y="493" class="caption">Método 3: Elemento ▲2 separado</text>

  <!-- FOOTER PRINCIPLES & SUMMARY (Text Spacing Fixed) -->
  <rect x="50" y="605" width="780" height="32" rx="4" fill="#F4F5F7" />
  <text x="65" y="625" class="caption">✓ <tspan font-weight="700">ISA-101.01:</tspan> Rango normal azul claro (#BAE6FD)</text>
  <text x="365" y="625" class="caption">✓ <tspan font-weight="700">WCAG 2.1 AA:</tspan> Ámbar #AC5E04 (3.47:1)</text>
  <text x="655" y="625" class="caption">✓ <tspan font-weight="700">500 Lux:</tspan> Sala Control</text>

</svg>
